[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profilekit-agent"
version = "0.1.0"
description = "Privacy-conscious agent for editable single-page personal profiles"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.22,<0.23",
  "pydantic>=2.12,<3",
  "pypdf>=6.8,<7",
  "python-docx>=1.2,<2",
]

[project.scripts]
profilekit = "profilekit.cli:main"

[tool.setuptools.packages.find]
include = ["profilekit*"]
